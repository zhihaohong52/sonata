name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Sonata runs every harness inside a tmux session, so the test suite
      # genuinely needs tmux — the fake harness and pane capture depend on it.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - run: npm ci

      - run: npm run typecheck

      # Every test consistently passes — locally and on every CI attempt — but
      # the vitest process itself sometimes never exits afterward on Linux
      # (worker pinned at ~100% CPU in teardown; root cause not established
      # after profiling). Bounding the step and gating on the JSON reporter's
      # result, written the moment tests finish, makes CI deterministic
      # without papering over a real failure: a genuine test failure still
      # fails the job, but a process that won't exit after everything passed
      # no longer blocks every push for hours.
      - name: Run npm test
        timeout-minutes: 3
        continue-on-error: true
        id: test
        run: node_modules/.bin/vitest run --reporter=default --reporter=json --outputFile=/tmp/vitest-result.json

      - name: Check test results
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("/tmp/vitest-result.json")) {
              console.error("No results file — vitest did not get far enough to report.");
              process.exit(1);
            }
            const r = JSON.parse(fs.readFileSync("/tmp/vitest-result.json", "utf8"));
            console.log(`${r.numPassedTests}/${r.numTotalTests} tests passed, ${r.numFailedTests} failed.`);
            if (!r.success || r.numFailedTests > 0) process.exit(1);
          '

      # Catches the packaging mistakes that only appear at publish time:
      # a missing runtime asset, or a bin target excluded by `files`.
      - name: Verify package contents
        run: |
          npm run build
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const files = require("/tmp/pack.json")[0].files.map(f => f.path);
            const required = [
              "dist/cli.js",
              "roles/code.md",
              "roles/review.md",
              "hooks/capture-mode.mjs",
              "README.md",
              "LICENSE",
            ];
            const missing = required.filter(f => !files.includes(f));
            if (missing.length) {
              console.error("Missing from tarball:", missing.join(", "));
              process.exit(1);
            }
            console.log("Tarball contains all " + required.length + " required files.");
          '

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the suite and the tarball check need nothing more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The suite, its tmux dependency, and the tarball-contents check all
      # live in the composite action so `release.yml` runs exactly this.
      - uses: ./.github/actions/verify

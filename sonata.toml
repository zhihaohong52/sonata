[models.deepseek-v4-flash]
harness = "opencode"
id = "deepseek-v4-flash"

[models.kimi-k3]
harness = "opencode"
id = "kimi-k3"

[models.gpt-5-6-sol]
harness = "codex"
id = "gpt-5.6-sol"

# Pi takes model ids in provider/id form.
[models.pi-deepseek-v4-flash]
harness = "pi"
id = "opencode-go/deepseek-v4-flash"

[generate]
roles = ["code", "review", "explore", "plan"]
models = ["deepseek-v4-flash", "kimi-k3", "gpt-5-6-sol", "pi-deepseek-v4-flash"]

[run]
tail_window_seconds = 20
stall_timeout_seconds = 120
run_timeout_seconds = 1800
